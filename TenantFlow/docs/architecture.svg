<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="755" viewBox="0 0 1270 755" role="img" aria-labelledby="title desc"><title id="title">TenantFlow system architecture</title><desc id="desc">Browser requests pass through sessions and tenant authorization. Owners use Stripe billing. Verified webhooks update organization subscription state in the database.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9ca9cc"/></marker></defs><rect width="1270" height="755" rx="20" fill="#f8f9fd"/><text x="70" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#35466a">TenantFlow / System architecture</text><text x="70" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#8c9cba">Identity, organization boundaries, and subscription access — enforced on the server.</text><path d="M215 240 V315" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="227" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">HTTPS</text><path d="M215 420 V495" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="227" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Authorize</text><path d="M360 548 H490" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="391" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Scoped query</text><path d="M360 368 H490" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="389" y="355" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Owner check</text><path d="M780 368 H850 V188 H910" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Stripe API</text><path d="M1055 240 V315" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="1068" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Signed events</text><path d="M1055 420 V495" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="1068" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Current state</text><path d="M910 548 H780" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="796" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Atomic commit</text><path d="M635 420 V495" fill="none" stroke="#aab6d5" stroke-width="2" marker-end="url(#arrow)"/><text x="649" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#8d9ec4">Org billing</text><rect x="70" y="135" width="290" height="105" rx="12" fill="#eef2ff" stroke="#dfe5f2"/><text x="90" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Browser dashboard</text><text x="90" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Organizations, projects and billing</text><text x="90" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">No client-controlled entitlements</text><rect x="70" y="315" width="290" height="105" rx="12" fill="#f0f3fa" stroke="#dfe5f2"/><text x="90" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Express API</text><text x="90" y="371" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Session · Origin · Input validation</text><text x="90" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">HttpOnly cookie / hashed token</text><rect x="70" y="495" width="290" height="105" rx="12" fill="#eef2ff" stroke="#dfe5f2"/><text x="90" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Tenant authorization</text><text x="90" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Membership + role on every request</text><text x="90" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Organization-scoped resource queries</text><rect x="490" y="315" width="290" height="105" rx="12" fill="#f2edff" stroke="#dfe5f2"/><text x="510" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Owner-only billing</text><text x="510" y="371" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Checkout / portal / invoices</text><text x="510" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Server-selected Stripe Price IDs</text><rect x="910" y="135" width="290" height="105" rx="12" fill="#f2edff" stroke="#dfe5f2"/><text x="930" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Stripe-hosted services</text><text x="930" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Checkout and Customer Portal</text><text x="930" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Payment details stay with Stripe</text><rect x="910" y="315" width="290" height="105" rx="12" fill="#edf6f3" stroke="#dfe5f2"/><text x="930" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Verified webhook</text><text x="930" y="371" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Raw body + Stripe signature</text><text x="930" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Snapshot event payload</text><rect x="910" y="495" width="290" height="105" rx="12" fill="#edf6f3" stroke="#dfe5f2"/><text x="930" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">Subscription state</text><text x="930" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Deduplicate · retrieve · map customer</text><text x="930" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Canonical status and entitlements</text><rect x="490" y="495" width="290" height="105" rx="12" fill="#eef2ff" stroke="#dfe5f2"/><text x="510" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5e719a">SQLite / PostgreSQL</text><text x="510" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#889bbc">Organizations · memberships · projects</text><text x="510" y="573" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a0afca">Sessions · billing · processed events</text><line x1="70" y1="648" x2="1200" y2="648" stroke="#e0e6f2"/><text x="70" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7c8fab">A success redirect grants no access. Verified subscription state controls paid features.</text><text x="70" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9aaac6">Starter: 3 projects / 3 seats   ·   Pro: 50 / 15   ·   Business: 1,000 / 50   ·   Active or trialing recognized subscriptions only</text></svg>